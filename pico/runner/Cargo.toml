[package]
name = "zesu-pico-runner"
version = "0.1.0"
edition = "2021"
description = "Host runner for the zesu-pico zkVM guest"

[[bin]]
name = "zesu-pico-runner"
path = "src/main.rs"

[workspace]

[dependencies]
# Pinned to the Pico release eth-act/ere v0.20.2 uses (v3.1.5; see
# pico-prover/pico-sdk in ere's Cargo.toml). Keep in sync with ere: the release workflow
# generates the VK with ere-server-pico, which embeds this release. Pico builds with the
# nightly named in rust-toolchain; cargo fetches the git checkout itself.
# pico-vm only for its logger; mmap-memory keeps emulation RSS low.
pico-vm = { git = "https://github.com/brevis-network/pico", tag = "v3.1.5", features = ["mmap-memory"] }
# The prover API ere's PicoProver wraps: execute, chunked execute (-X) and prove (-p).
pico-prover = { git = "https://github.com/brevis-network/pico", tag = "v3.1.5", features = ["mmap-memory"] }
eyre = "0.6"
