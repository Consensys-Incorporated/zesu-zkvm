name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZISK_VERSION: "1.3.2-alpha"
  ZISK_TARGET: riscv64ima-zisk-zkvm-elf
  # zesu revision the guest object is built from. Any commit-ish works; prefer a
  # full SHA so a CI result stays reproducible.
  #
  # Built from source rather than downloaded from a GitHub release: release
  # assets exist only for releases, and zesu publishes them by manual dispatch,
  # so `releases/latest` drifts behind this repo's vectors and linker script
  # without anything failing loudly. Pinning a commit makes the coupling between
  # the two repos explicit — bump this line to move.
  #
  # zesu main at #146, the tests-zkevm@v21.0.5 input layout (no public_keys,
  # block_hash checked against the header). The vectors are encoded for it.
  ZESU_REF: "3f982aabda5027b658e79c9b1cc9e3ec88705139"

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zesu-zkvm
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: zesu-zkvm

      - name: Checkout zisk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 0xPolygonHermez/zisk
          ref: v${{ env.ZISK_VERSION }}
          path: zisk

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-zisk runtime deps
        run: sudo apt-get install -y libomp5 libopenmpi3t64

      - name: Install cargo-zisk
        run: |
          ZISK_BIN_DIR="${HOME}/.config/.zisk/bin"
          mkdir -p "$ZISK_BIN_DIR"
          curl -fsSL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup" \
            -o "$ZISK_BIN_DIR/ziskup"
          chmod +x "$ZISK_BIN_DIR/ziskup"
          "$ZISK_BIN_DIR/ziskup" --cpu --nokey
          echo "$ZISK_BIN_DIR" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Zisk Rust toolchain
        run: cargo +zisk --version 2>/dev/null || cargo-zisk toolchain install

      - name: Cache libziskos_staticlib.a
        id: cache-libziskos
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: zesu-zkvm/zisk/lib/libziskos_staticlib.a
          key: libziskos-staticlib-${{ env.ZISK_VERSION }}-${{ runner.os }}-${{ hashFiles('zesu-zkvm/zisk/Makefile') }}

      - name: Build libziskos_staticlib.a
        if: steps.cache-libziskos.outputs.cache-hit != 'true'
        working-directory: zesu-zkvm/zisk
        run: make lib/libziskos_staticlib.a ZISK_DIR=$GITHUB_WORKSPACE/zisk

      - name: Checkout zesu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Consensys-Incorporated/zesu
          ref: ${{ env.ZESU_REF }}
          path: zesu

      - name: Build zesu object
        working-directory: zesu
        run: |
          zig build rv64im-object -Doptimize=ReleaseFast
          mkdir -p /tmp/zesu-obj
          cp zig-out/lib/zesu.o /tmp/zesu-obj/zesu.rv64im.o

      - name: Lint (zisk)
        working-directory: zesu-zkvm/zisk
        run: zig fmt --check src/ build.zig

      - name: Build zisk (Debug)
        working-directory: zesu-zkvm/zisk
        run: zig build -Dzesu_obj=/tmp/zesu-obj/zesu.rv64im.o

      - name: Build zisk (ReleaseFast)
        working-directory: zesu-zkvm/zisk
        run: zig build -Doptimize=ReleaseFast -Dzesu_obj=/tmp/zesu-obj/zesu.rv64im.o

      - name: Test (zisk)
        working-directory: zesu-zkvm/zisk
        run: zig build test --summary all -Dzesu_obj=/tmp/zesu-obj/zesu.rv64im.o

      - name: Lint (openvm)
        working-directory: zesu-zkvm/openvm
        run: zig fmt --check src/ build.zig

      - name: Build openvm (ReleaseFast)
        working-directory: zesu-zkvm/openvm
        run: zig build -Doptimize=ReleaseFast -Dzesu_obj=/tmp/zesu-obj/zesu.rv64im.o

      - name: Lint (linea)
        working-directory: zesu-zkvm/linea
        run: zig fmt --check src/ build.zig

      - name: Build linea (ReleaseFast)
        working-directory: zesu-zkvm/linea
        run: zig build -Doptimize=ReleaseFast -Dzesu_obj=/tmp/zesu-obj/zesu.rv64im.o

  vectors:
    name: Vectors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zesu-zkvm
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: zesu-zkvm

      - name: Checkout zisk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 0xPolygonHermez/zisk
          ref: v${{ env.ZISK_VERSION }}
          path: zisk

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-zisk runtime deps
        run: sudo apt-get install -y libomp5 libopenmpi3t64

      - name: Install cargo-zisk
        run: |
          ZISK_BIN_DIR="${HOME}/.config/.zisk/bin"
          mkdir -p "$ZISK_BIN_DIR"
          curl -fsSL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup" \
            -o "$ZISK_BIN_DIR/ziskup"
          chmod +x "$ZISK_BIN_DIR/ziskup"
          "$ZISK_BIN_DIR/ziskup" --cpu --nokey
          echo "$ZISK_BIN_DIR" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Zisk Rust toolchain
        run: cargo +zisk --version 2>/dev/null || cargo-zisk toolchain install

      - name: Cache libziskos_staticlib.a
        id: cache-libziskos
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: zesu-zkvm/zisk/lib/libziskos_staticlib.a
          key: libziskos-staticlib-${{ env.ZISK_VERSION }}-${{ runner.os }}-${{ hashFiles('zesu-zkvm/zisk/Makefile') }}

      - name: Build libziskos_staticlib.a
        if: steps.cache-libziskos.outputs.cache-hit != 'true'
        working-directory: zesu-zkvm/zisk
        run: make lib/libziskos_staticlib.a ZISK_DIR=$GITHUB_WORKSPACE/zisk

      - name: Checkout zesu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Consensys-Incorporated/zesu
          ref: ${{ env.ZESU_REF }}
          path: zesu

      - name: Build zesu object
        working-directory: zesu
        run: |
          zig build zisk-object -Doptimize=ReleaseFast
          mkdir -p /tmp/zesu-obj
          cp zig-out/lib/zesu-zisk.o /tmp/zesu-obj/zesu.zisk.o

      - name: Run vectors
        working-directory: zesu-zkvm/zisk
        run: make test ZESU_OBJ=/tmp/zesu-obj/zesu.zisk.o

  pico:
    name: Pico (build, test & vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout zesu-zkvm
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      # The runner links Pico's own crates, which pin this nightly (see pico/runner/rust-toolchain).
      - name: Install Rust nightly for the Pico runner
        run: rustup toolchain install nightly-2025-08-04 --profile minimal

      - name: Cache cargo and runner build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pico/runner/target
          key: pico-runner-${{ runner.os }}-${{ hashFiles('pico/runner/Cargo.lock', 'pico/runner/Cargo.toml', 'pico/runner/rust-toolchain') }}

      # zesu is fetched by `zig build` itself, at the commit pinned in pico/build.zig.zon, and
      # built here for Pico's own target. No zesu checkout or prebuilt object is involved.
      - name: Lint (pico)
        working-directory: pico
        run: zig fmt --check src/ build.zig

      - name: Lint (shared)
        working-directory: shared
        run: zig fmt --check src/ build.zig

      - name: Build pico (ReleaseFast)
        working-directory: pico
        run: zig build -Doptimize=ReleaseFast

      - name: Build pico runner
        working-directory: pico
        run: make runner

      # Native unit tests of the shared crypto: EIP vectors, KZG vectors, ECDSA differential tests.
      - name: Unit tests (shared)
        working-directory: shared
        run: zig build test -Doptimize=ReleaseFast

      # Execute every vector on Pico's VM and compare the output with its expected.hex.
      - name: Vectors (pico)
        working-directory: pico
        run: make test

      # Run the crypto modules on the VM: precompile-backed path vs software path + known answers.
      - name: Crypto self-test on the VM (pico)
        working-directory: pico
        run: make selftest
