name: Release

# Builds ELF artifacts for each supported zkVM target against a published
# zesu.rv64im.o object and creates a draft GitHub Release.
#
# Trigger manually: Actions → "Release" → Run workflow
#   release_tag  — tag to create for this repo (e.g. bal-devnet-3)
#   zesu_version — zesu release tag to pull zesu.rv64im.o from (empty = latest)
#
# Targets built:
#   zisk    — ZisK v1.0.0-alpha; links zesu.o + zisk-wrapped.o (host + libziskos_staticlib merged)
#   openvm  — OpenVM rv64im; links zesu.o + openvm-host.o
#   linea   — Linea rv64im; links zesu.o + linea-host.o; stripped ELF
#
# Release asset naming: stateless-validator-<guestName>-<zkVMName>-<zkVMVersion>.elf
# OpenVM and Linea have no pinned upstream zkVM release to cite yet — both guests
# reimplement the target ABI directly rather than linking a versioned upstream
# crate — so their version segment is the placeholder "ALPHA" until a real
# upstream version exists.
#
# Verification keys (.vk): generated only for ZisK, via ere-server-zisk's
# `keygen` (a zkVM-specific commitment to the compiled ELF — see ere at
# https://github.com/eth-act/ere). Not generated for:
#   - OpenVM: its real proving machine is RV32IM, but zesu-zkvm's OpenVM guest
#     is built as riscv64-freestanding-none — ere-server-openvm rejects the ELF
#     outright ("not a 32-bit ELF"). This is a target-architecture mismatch,
#     not a CI gap; fixing it is a separate, larger task.
#   - Linea: no ere support exists for it at all — Linea's zkc/go-corset
#     arithmetization checker has no per-guest "verification key" concept the
#     way SP1/ZisK/OpenVM do.
# All three ELFs are still signed below regardless — signing is a generic,
# zkVM-agnostic operation (minisign over whatever bytes we produce) and
# doesn't depend on a zkVM having a VK concept at all.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for this repo (e.g. bal-devnet-3)"
        required: true
        type: string
      zesu_version:
        description: "zesu release tag to build against (e.g. bal-devnet-3); leave empty to use the latest published release. Must be a release tag — branch names will 404."
        required: false
        type: string
        default: ""

env:
  ZISK_VERSION: "1.0.0-alpha"
  OPENVM_VERSION: "ALPHA"
  LINEA_VERSION: "ALPHA"
  # ere (https://github.com/eth-act/ere) revision whose ere-server-* images we
  # pull for VK generation. Keep in sync with the rev ere-guests pins for
  # ere-platform-core (see its Cargo.lock) — bump when they bump.
  ERE_TAG: "58ca85b"

permissions:
  contents: write

jobs:
  compile-zisk:
    name: Compile stateless-validator-zesu-zisk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zesu-zkvm
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout zisk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 0xPolygonHermez/zisk
          ref: v${{ env.ZISK_VERSION }}
          path: upstream-zisk

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-zisk runtime deps
        run: sudo apt-get install -y libomp5 libopenmpi3t64

      - name: Install cargo-zisk
        run: |
          ZISK_BIN_DIR="${HOME}/.config/.zisk/bin"
          mkdir -p "$ZISK_BIN_DIR"
          curl -fsSL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup" \
            -o "$ZISK_BIN_DIR/ziskup"
          chmod +x "$ZISK_BIN_DIR/ziskup"
          "$ZISK_BIN_DIR/ziskup" --cpu --nokey
          echo "$ZISK_BIN_DIR" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Zisk Rust toolchain
        run: cargo +zisk --version 2>/dev/null || cargo-zisk toolchain install

      - name: Cache libziskos_staticlib.a
        id: cache-libziskos
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: zisk/lib/libziskos_staticlib.a
          key: libziskos-staticlib-${{ env.ZISK_VERSION }}-${{ runner.os }}

      - name: Build libziskos_staticlib.a
        if: steps.cache-libziskos.outputs.cache-hit != 'true'
        working-directory: zisk
        run: make lib/libziskos_staticlib.a ZISK_DIR=$GITHUB_WORKSPACE/upstream-zisk

      - name: Download zesu object
        run: |
          mkdir -p /tmp/zesu-obj
          if [ -n "${{ inputs.zesu_version }}" ]; then
            URL="https://github.com/Consensys/zesu/releases/download/${{ inputs.zesu_version }}/zesu.rv64im.o"
          else
            URL="https://github.com/Consensys/zesu/releases/latest/download/zesu.rv64im.o"
          fi
          curl -fsSL "$URL" -o /tmp/zesu-obj/zesu.rv64im.o

      - name: Build Zesu ZisK ELF
        working-directory: zisk
        run: zig build -Doptimize=ReleaseFast -Dzesu_obj=/tmp/zesu-obj/zesu.rv64im.o

      - name: Free up disk space for ere-server-zisk image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet           # remove dotnet
          sudo rm -rf /usr/local/lib/android       # remove android
          sudo rm -rf /opt/ghc /usr/local/.ghcup   # remove haskell
          sudo rm -rf /opt/hostedtoolcache         # remove codeql
          df -h /

      - name: Generate program VK
        run: |
          docker pull "ghcr.io/eth-act/ere/ere-server-zisk:${{ env.ERE_TAG }}"
          docker run --rm \
            -v "${{ github.workspace }}/zisk/zig-out/bin:/output" \
            "ghcr.io/eth-act/ere/ere-server-zisk:${{ env.ERE_TAG }}" \
            --elf-path /output/zesu-zisk \
            keygen \
            --program-vk-path /output/zesu-zisk.vk

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stateless-validator-zesu-zisk-${{ env.ZISK_VERSION }}
          path: |
            zisk/zig-out/bin/zesu-zisk
            zisk/zig-out/bin/zesu-zisk.vk
          if-no-files-found: error

  # No VK step here: ere-server-openvm requires a 32-bit ELF and rejects ours
  # outright ("not a 32-bit ELF") since this target builds riscv64-freestanding-none
  # — see the naming-convention comment at the top of this file.
  compile-openvm:
    name: Compile stateless-validator-zesu-openvm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zesu-zkvm
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Download zesu object
        run: |
          mkdir -p /tmp/zesu-obj
          if [ -n "${{ inputs.zesu_version }}" ]; then
            URL="https://github.com/Consensys/zesu/releases/download/${{ inputs.zesu_version }}/zesu.rv64im.o"
          else
            URL="https://github.com/Consensys/zesu/releases/latest/download/zesu.rv64im.o"
          fi
          curl -fsSL "$URL" -o /tmp/zesu-obj/zesu.rv64im.o

      - name: Build Zesu OpenVM ELF
        working-directory: openvm
        run: zig build -Doptimize=ReleaseFast -Dzesu_obj=/tmp/zesu-obj/zesu.rv64im.o

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stateless-validator-zesu-openvm-${{ env.OPENVM_VERSION }}
          path: openvm/zig-out/bin/zesu-openvm
          if-no-files-found: error

  # No VK step here: Linea isn't part of the ere ecosystem, and its zkc/go-corset
  # arithmetization checker has no per-guest "verification key" concept — see the
  # naming-convention comment at the top of this file.
  compile-linea:
    name: Compile stateless-validator-zesu-linea
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zesu-zkvm
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Download zesu object
        run: |
          mkdir -p /tmp/zesu-obj
          if [ -n "${{ inputs.zesu_version }}" ]; then
            URL="https://github.com/Consensys/zesu/releases/download/${{ inputs.zesu_version }}/zesu.rv64im.o"
          else
            URL="https://github.com/Consensys/zesu/releases/latest/download/zesu.rv64im.o"
          fi
          curl -fsSL "$URL" -o /tmp/zesu-obj/zesu.rv64im.o

      - name: Build Zesu Linea ELF
        working-directory: linea
        run: zig build -Doptimize=ReleaseFast -Dzesu_obj=/tmp/zesu-obj/zesu.rv64im.o

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stateless-validator-zesu-linea-${{ env.LINEA_VERSION }}
          path: linea/zig-out/bin/zesu-linea
          if-no-files-found: error

  release:
    name: Publish draft GitHub Release
    needs: [compile-zisk, compile-openvm, compile-linea]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Rename artifacts
        run: |
          mv artifacts/zesu-zisk      "artifacts/stateless-validator-zesu-zisk-${{ env.ZISK_VERSION }}.elf"
          mv artifacts/zesu-zisk.vk   "artifacts/stateless-validator-zesu-zisk-${{ env.ZISK_VERSION }}.vk"
          mv artifacts/zesu-openvm    "artifacts/stateless-validator-zesu-openvm-${{ env.OPENVM_VERSION }}.elf"
          mv artifacts/zesu-linea     "artifacts/stateless-validator-zesu-linea-${{ env.LINEA_VERSION }}.elf"

      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # Signing is generic and zkVM-agnostic: every release asset gets a detached
      # minisig regardless of whether that target has a VK. Requires repo secrets
      # MINISIGN_SECRET_KEY / MINISIGN_PUBLIC_KEY / MINISIGN_PASSWORD (generate a
      # keypair with `minisign -G` and store it as repo secrets — do not reuse
      # another project's key).
      - name: Sign artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          echo "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_PUBLIC_KEY" > minisign.pub

          for file in artifacts/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Signing $filename..."
            # -S: sign, -m: file, -s: secret key, -x: output signature, -t: trusted comment
            echo "$MINISIGN_PASSWORD" | minisign -Sm "$file" -s minisign.key -x "$file.minisig" -t "$filename"
          done

          cp minisign.pub artifacts/
          rm minisign.key

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ inputs.release_tag }}" \
            --notes "Built against zesu ${{ inputs.zesu_version || 'latest' }}" \
            --draft \
            artifacts/*
