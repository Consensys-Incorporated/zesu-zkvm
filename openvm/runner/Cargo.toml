[package]
name = "zesu-openvm-runner"
version = "0.1.0"
edition = "2021"
description = "Host runner for the zesu-openvm zkVM guest"

[[bin]]
name = "zesu-openvm-runner"
path = "src/main.rs"

# Pinned to what eth-act/ere v0.19.5 executes guests with, so a pass here means
# a pass on the dashboard: openvm v2.1.0-preview plus han0110's patch branch.
# Cargo.lock is seeded from ere's, which fixes the revisions.
[dependencies]
openvm-sdk        = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview" }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview" }
openvm-transpiler = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview" }
eyre              = "0.6"
