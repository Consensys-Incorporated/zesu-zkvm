[package]
name = "zesu-openvm-runner"
version = "0.1.0"
edition = "2021"
description = "Host runner for the zesu-openvm zkVM guest"

[[bin]]
name = "zesu-openvm-runner"
path = "src/main.rs"

# Pinned to the revisions eth-act/ere v0.17.0 executes guests with, so a pass
# here means a pass on the dashboard: openvm v2.1.0-preview plus a deps-only
# patch (git p3 crates; stark-backend's develop-v2.1.0 branch no longer exists).
[dependencies]
openvm-sdk        = { git = "https://github.com/han0110/openvm.git", rev = "a391b22ebb5305fa52d3394abfd0810df4baff90" }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", rev = "a391b22ebb5305fa52d3394abfd0810df4baff90" }
openvm-transpiler = { git = "https://github.com/han0110/openvm.git", rev = "a391b22ebb5305fa52d3394abfd0810df4baff90" }
eyre              = "0.6"
